# Builds and publishes on pushes to main and daily to refresh event dates.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
# Optional: add a repository variable PUBLIC_SUBSCRIBE_ENDPOINT for the mailing-list form.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v6
      - uses: withastro/action@v6
        env:
          PAGES_SITE: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          PUBLIC_SUBSCRIBE_ENDPOINT: ${{ vars.PUBLIC_SUBSCRIBE_ENDPOINT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
